[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provfold"
version = "0.1.1"
description = "Provenance-aware aggregation of heterogeneous taxon-direction evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Wenxuan Yang"}
]
keywords = ["microbiome", "evidence synthesis", "provenance", "taxonomy", "abstention"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = []

[project.optional-dependencies]
reproduction = ["openpyxl==3.1.5"]

[project.urls]
Homepage = "https://github.com/Streamvolume/ProvFold"
Repository = "https://github.com/Streamvolume/ProvFold"
Archive = "https://doi.org/10.5281/zenodo.21915120"

[project.scripts]
provfold = "provfold.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provfold = ["py.typed"]
